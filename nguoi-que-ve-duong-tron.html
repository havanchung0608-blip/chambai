<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người que vẽ đường tròn</title>
<style>
  :root{
    --bg:#eaf1fb; --ink:#1d2b4f; --accent:#e8553a; --blue:#2f6fde; --green:#1f9d6b; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:linear-gradient(180deg,#f4f8ff 0%,var(--bg) 100%);
    font-family:"Times New Roman",Times,serif; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:0 16px 16px;
  }
  h1{font-size:clamp(24px,3.2vw,36px); margin:12px 0 8px; text-align:center}
  h1 span{color:var(--blue)}
  .stage{width:min(100%, calc((100vh - 250px) * 16 / 9)); min-width:280px}
  canvas{width:100%; aspect-ratio:16/9; display:block; border-radius:18px;
         box-shadow:0 10px 30px rgba(30,50,90,.18); background:#fff; touch-action:manipulation}
  .caption{
    margin-top:12px; background:var(--card); border-left:8px solid var(--blue);
    border-radius:12px; padding:10px 18px; font-size:clamp(20px,2.4vw,30px); line-height:1.35;
    min-height:2.9em; box-shadow:0 4px 14px rgba(30,50,90,.10);
  }
  .caption b{color:var(--accent)}
  .bar{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; margin-top:12px}
  button{
    font-family:inherit; font-size:clamp(17px,1.9vw,22px); font-weight:bold; border:0; cursor:pointer;
    padding:10px 18px; border-radius:999px; color:#fff; background:var(--blue);
    box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .08s;
  }
  button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #btnStep{background:#7a4fd6} #btnFast{background:#e89a1a} #btnReset{background:#5b6b86}
  #btnVoice{background:var(--green)} #btnVoice.off{background:#9aa6b8}
  .dots{display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap}
  .dot{width:34px; height:34px; border-radius:50%; background:#d6def0; color:var(--ink);
       display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:17px; cursor:pointer}
  .dot.done{background:#9cc3ff} .dot.now{background:var(--accent); color:#fff}
</style>
</head>
<body>
<h1>Người que vẽ <span>đường tròn (O; R)</span></h1>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="caption" id="cap"></div>
  <div class="dots" id="dots"></div>
  <div class="bar">
    <button id="btnPlay">▶ Tự động</button>
    <button id="btnStep">⏭ Từng bước</button>
    <button id="btnFast">⚡ Vẽ nhanh</button>
    <button id="btnReset">↺ Làm lại</button>
    <button id="btnVoice">🔊 Giọng đọc: Bật</button>
  </div>
</div>

<script>
(() => {
  // ====== Hằng số khung cảnh (toạ độ logic 1280 x 720) ======
  const W = 1280, H = 720;
  const O = {x: 820, y: 330};
  const R = 170;                 // 3 cm
  const CM = R / 3;              // 1 cm = 56,67 px
  const LEG = 120;               // chiều dài mỗi chân compa
  const HANDLE = 26;             // tay cầm compa
  const RULER = {x0: 620, y: 570, h: 42, left: 596, right: 1150};
  const NEEDLE_ON_RULER = {x: RULER.x0, y: RULER.y - 2};
  const GROUND = 700, HIP_Y = 545, SH_Y = 372, NECK_Y = 356, HEAD_Y = 325, HEAD_R = 30;
  const ARM = 116, THIGH = 82;
  const A_ANG = -35 * Math.PI / 180;
  const A = {x: O.x + R * Math.cos(A_ANG), y: O.y + R * Math.sin(A_ANG)};
  const TR = 0.22;               // phần đầu mỗi bước dành cho chuyển tư thế

  const STEPS = [
    {dur: 4.5, cap: 'Xin chào các bạn! Hôm nay mình sẽ vẽ <b>đường tròn tâm <i>O</i>, bán kính <i>R</i> = 3 cm</b>.',
     say: 'Xin chào các bạn! Hôm nay mình sẽ vẽ đường tròn tâm O, bán kính R bằng 3 xăng ti mét.'},
    {dur: 4,   cap: '<b>Bước 1.</b> Chấm một điểm <i>O</i> trên bảng làm <b>tâm</b> của đường tròn.',
     say: 'Bước 1. Chấm một điểm O trên bảng làm tâm của đường tròn.'},
    {dur: 6.5, cap: '<b>Bước 2.</b> Mở compa: mũi nhọn đặt ở vạch 0, đầu chì đặt ở vạch 3 của thước. Khẩu độ compa bằng <b><i>R</i> = 3 cm</b>.',
     say: 'Bước 2. Mở compa: mũi nhọn đặt ở vạch 0, đầu chì đặt ở vạch 3 của thước. Khẩu độ compa bằng R, bằng 3 xăng ti mét.'},
    {dur: 4.5, cap: '<b>Bước 3.</b> Giữ nguyên khẩu độ, đặt <b>mũi nhọn</b> compa đúng vào tâm <i>O</i>.',
     say: 'Bước 3. Giữ nguyên khẩu độ, đặt mũi nhọn compa đúng vào tâm O.'},
    {dur: 8,   cap: '<b>Bước 4.</b> Giữ chặt mũi nhọn tại <i>O</i>, <b>quay compa một vòng</b>: đầu chì vạch nên đường tròn.',
     say: 'Bước 4. Giữ chặt mũi nhọn tại O, quay compa một vòng. Đầu chì vạch nên đường tròn.'},
    {dur: 6,   cap: 'Xong! Ta được <b>đường tròn tâm <i>O</i>, bán kính <i>R</i> = 3 cm</b>, kí hiệu <b>(<i>O</i>; 3 cm)</b>.',
     say: 'Xong! Ta được đường tròn tâm O, bán kính R bằng 3 xăng ti mét, kí hiệu là O, 3 xăng ti mét.'},
    {dur: 8,   cap: 'Mọi điểm <i>M</i> nằm trên đường tròn đều cách tâm <i>O</i> một khoảng <b><i>OM</i> = <i>R</i> = 3 cm</b>.',
     say: 'Mọi điểm M nằm trên đường tròn đều cách tâm O một khoảng O M bằng R, bằng 3 xăng ti mét.'}
  ];
  const STARTS = []; let TOTAL = 0;
  STEPS.forEach(s => { STARTS.push(TOTAL); TOTAL += s.dur; });

  // ====== Tiện ích ======
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpP = (p, q, t) => ({x: lerp(p.x, q.x, t), y: lerp(p.y, q.y, t)});
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

  function locate(T) {
    for (let i = 0; i < STEPS.length; i++)
      if (T < STARTS[i] + STEPS[i].dur) return {i, t: Math.max(0, (T - STARTS[i]) / STEPS[i].dur)};
    return {i: STEPS.length - 1, t: 1};
  }

  // Hình học compa: mũi nhọn N, góc quay th, khẩu độ d
  function compassGeom(N, th, d) {
    const ux = Math.cos(th), uy = Math.sin(th);
    const P = {x: N.x + d * ux, y: N.y + d * uy};
    const M = {x: (N.x + P.x) / 2, y: (N.y + P.y) / 2};
    const h = Math.sqrt(Math.max(0, LEG * LEG - d * d / 4));
    const px = uy, py = -ux;                       // pháp tuyến (hướng "lên" khi th = 0)
    const Hg = {x: M.x + h * px, y: M.y + h * py};
    const Tp = {x: Hg.x + HANDLE * px, y: Hg.y + HANDLE * py};
    return {N, P, H: Hg, T: Tp};
  }

  const shoulder = fx => ({x: fx, y: SH_Y});
  const restHand = fx => ({x: fx + 30, y: SH_Y + 170});
  const pointHand = fx => {
    const S = shoulder(fx), dx = O.x - S.x, dy = O.y - S.y, L = Math.hypot(dx, dy);
    return {x: S.x + 222 * dx / L, y: S.y + 222 * dy / L};
  };

  // Trạng thái nhân vật + compa của bước i tại tiến độ u
  function stateOf(i, u) {
    const st = {fx: 450, hand: null, compass: null};
    switch (i) {
      case 0: {
        st.fx = lerp(-120, 450, ease(clamp(u / 0.7)));
        const S = shoulder(st.fx);
        const wave = clamp((u - 0.7) / 0.1);
        const wv = {x: S.x + 110, y: S.y - 165 + 22 * Math.sin(clock * 9)};
        st.hand = lerpP(restHand(st.fx), wv, wave);
        break;
      }
      case 1: {
        st.fx = 640;
        const r = restHand(st.fx);
        if (u < 0.45) st.hand = lerpP(r, {x: O.x - 4, y: O.y + 4}, ease(u / 0.45));
        else st.hand = lerpP({x: O.x - 4, y: O.y + 4}, {x: O.x - 70, y: O.y + 70}, ease(clamp((u - 0.55) / 0.45)));
        break;
      }
      case 2: {
        const g = compassGeom(NEEDLE_ON_RULER, 0, R * ease(clamp(u / 0.85)));
        st.compass = g; st.hand = g.T; st.fx = g.T.x - 125;
        break;
      }
      case 3: {
        const e = ease(u);
        const N = lerpP(NEEDLE_ON_RULER, O, e); N.y -= 70 * Math.sin(Math.PI * u);
        const g = compassGeom(N, 0, R);
        st.compass = g; st.hand = g.T; st.fx = g.T.x - 125;
        break;
      }
      case 4: {
        const g = compassGeom(O, -2 * Math.PI * ease(u), R);
        st.compass = g; st.hand = g.T; st.fx = g.T.x - 125;
        break;
      }
      default: {
        st.fx = 450; st.hand = pointHand(450);
        if (i === 5) st.compass = compassGeom(O, 0, R);
      }
    }
    return st;
  }

  // ====== Canvas ======
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  function resize() {
    const dpr = window.devicePixelRatio || 1, w = cv.getBoundingClientRect().width;
    cv.width = Math.round(w * dpr); cv.height = Math.round(w * 9 / 16 * dpr);
  }
  window.addEventListener('resize', resize);

  function label(txt, x, y, size = 30, color = '#1d2b4f', italic = true) {
    ctx.save();
    ctx.font = `${italic ? 'italic ' : ''}bold ${size}px "Times New Roman", Times, serif`;
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.strokeText(txt, x, y);
    ctx.fillText(txt, x, y); ctx.restore();
  }

  function drawRoom() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fdf6e8'); g.addColorStop(1, '#f6e8cc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#d9b98a'; ctx.fillRect(0, 660, W, 60);
    ctx.fillStyle = '#c9a674'; ctx.fillRect(0, 660, W, 6);
    // Bảng
    ctx.fillStyle = '#8a5a2b'; roundRect(318, 28, 934, 624, 14); ctx.fill();
    ctx.fillStyle = '#ffffff'; roundRect(332, 42, 906, 596, 8); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(332, 42, 906, 596); ctx.clip();
    ctx.strokeStyle = 'rgba(47,111,222,.08)'; ctx.lineWidth = 1;
    for (let x = O.x % CM; x < W; x += CM) { if (x > 332) { ctx.beginPath(); ctx.moveTo(x, 42); ctx.lineTo(x, 638); ctx.stroke(); } }
    for (let y = O.y % CM; y < 640; y += CM) { if (y > 42) { ctx.beginPath(); ctx.moveTo(332, y); ctx.lineTo(1238, y); ctx.stroke(); } }
    ctx.restore();
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(360, 636, 860, 12);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawRuler(alpha, highlight) {
    if (alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,236,150,.92)'; ctx.strokeStyle = '#b58a12'; ctx.lineWidth = 2;
    roundRect(RULER.left, RULER.y, RULER.right - RULER.left, RULER.h, 5); ctx.fill(); ctx.stroke();
    if (highlight > 0) {
      ctx.fillStyle = `rgba(232,85,58,${0.35 * highlight})`;
      ctx.fillRect(RULER.x0, RULER.y + 1, 3 * CM, RULER.h - 2);
    }
    ctx.strokeStyle = '#4a3a10'; ctx.lineWidth = 1.5;
    for (let k = 0; k <= 90; k++) {
      const x = RULER.x0 + k * CM / 10; if (x > RULER.right - 6) break;
      const len = k % 10 === 0 ? 16 : (k % 5 === 0 ? 11 : 6);
      ctx.beginPath(); ctx.moveTo(x, RULER.y); ctx.lineTo(x, RULER.y + len); ctx.stroke();
      if (k % 10 === 0) {
        ctx.fillStyle = '#4a3a10'; ctx.font = 'bold 18px "Times New Roman"'; ctx.textAlign = 'center';
        ctx.fillText(String(k / 10), x, RULER.y + 35);
      }
    }
    ctx.font = 'bold 13px "Times New Roman"'; ctx.textAlign = 'right'; ctx.fillStyle = '#4a3a10';
    ctx.fillText('cm', RULER.right - 8, RULER.y + 35);
    if (highlight > 0) label('3 cm', RULER.x0 + 1.5 * CM, RULER.y + RULER.h + 22, 26, '#e8553a', false);
    ctx.restore();
  }

  function drawCompass(g, alpha) {
    if (!g || alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round';
    // chân kim
    ctx.strokeStyle = '#6b7a90'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(g.H.x, g.H.y); ctx.lineTo(g.N.x, g.N.y); ctx.stroke();
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 3;
    const nv = {x: (g.N.x - g.H.x) / LEG, y: (g.N.y - g.H.y) / LEG};
    ctx.beginPath(); ctx.moveTo(g.N.x - nv.x * 14, g.N.y - nv.y * 14); ctx.lineTo(g.N.x, g.N.y); ctx.stroke();
    // chân chì
    ctx.strokeStyle = '#6b7a90'; ctx.lineWidth = 8;
    const pv = {x: (g.P.x - g.H.x) / LEG, y: (g.P.y - g.H.y) / LEG};
    const pb = {x: g.P.x - pv.x * 30, y: g.P.y - pv.y * 30};
    ctx.beginPath(); ctx.moveTo(g.H.x, g.H.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.strokeStyle = '#f2b705'; ctx.lineWidth = 9;
    const pt = {x: g.P.x - pv.x * 10, y: g.P.y - pv.y * 10};
    ctx.beginPath(); ctx.moveTo(pb.x, pb.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(g.P.x, g.P.y); ctx.stroke();
    // khớp + tay cầm
    ctx.strokeStyle = '#3d4a5f'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(g.H.x, g.H.y); ctx.lineTo(g.T.x, g.T.y); ctx.stroke();
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(g.H.x, g.H.y, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#3d4a5f'; ctx.beginPath(); ctx.arc(g.T.x, g.T.y, 6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // IK hai đoạn: trả về khớp giữa
  function ik(S, T, a, b, bendSign) {
    let d = dist(S, T); d = clamp(d, 1, a + b - 0.5);
    const phi = Math.atan2(T.y - S.y, T.x - S.x);
    const al = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
    const c1 = {x: S.x + a * Math.cos(phi + al), y: S.y + a * Math.sin(phi + al)};
    const c2 = {x: S.x + a * Math.cos(phi - al), y: S.y + a * Math.sin(phi - al)};
    const J = bendSign(c1, c2);
    const ang = Math.atan2(J.y - S.y, J.x - S.x);
    const E = {x: J.x + b * Math.cos(Math.atan2(T.y - J.y, T.x - J.x)), y: J.y + b * Math.sin(Math.atan2(T.y - J.y, T.x - J.x))};
    return {J, E, ang};
  }

  let walkW = 0, prevFx = null, facing = 1;
  function drawFigure(fx, hand, bubble) {
    const dx = prevFx === null ? 0 : fx - prevFx; prevFx = fx;
    const moving = Math.abs(dx) > 0.15 ? 1 : 0;
    walkW += (moving - walkW) * 0.18;
    if (Math.abs(dx) > 0.4) facing = dx > 0 ? 1 : -1;
    else if (hand && hand.x > fx + 20) facing = 1;
    const p = fx * 0.06;
    const hip = {x: fx, y: HIP_Y + 3 * walkW * Math.abs(Math.sin(p))};
    const S = shoulder(fx);
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1d2b4f'; ctx.lineWidth = 8;

    const below = (a, b) => (a.y > b.y ? a : b);
    const forward = (a, b) => ((a.x - b.x) * facing > 0 ? a : b);
    // chân
    const amp = 26 * walkW;
    const feet = [
      {x: fx - 18 + amp * Math.sin(p), y: GROUND - 14 * walkW * Math.max(0, Math.cos(p))},
      {x: fx + 18 - amp * Math.sin(p), y: GROUND - 14 * walkW * Math.max(0, -Math.cos(p))}
    ];
    feet.forEach(f => {
      const k = ik(hip, f, THIGH, THIGH, forward);
      ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(k.J.x, k.J.y); ctx.lineTo(k.E.x, k.E.y);
      ctx.lineTo(k.E.x + 14 * facing, k.E.y); ctx.stroke();
    });
    // thân
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(fx, NECK_Y); ctx.stroke();
    // tay sau (đung đưa)
    const back = {x: S.x - 18 * facing + 28 * walkW * Math.sin(p), y: S.y + 190};
    const backward = (a, b) => ((a.x - b.x) * facing < 0 ? a : b);
    let k = ik(S, back, ARM, ARM, backward);
    ctx.beginPath(); ctx.moveTo(S.x, S.y); ctx.lineTo(k.J.x, k.J.y); ctx.lineTo(k.E.x, k.E.y); ctx.stroke();
    // đầu
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(fx, HEAD_Y, HEAD_R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2b4f';
    ctx.beginPath(); ctx.arc(fx + 6 * facing, HEAD_Y - 6, 3.5, 0, 7); ctx.arc(fx + 18 * facing, HEAD_Y - 6, 3.5, 0, 7); ctx.fill();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(fx + 12 * facing, HEAD_Y + 4, 10, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.lineWidth = 8;
    // tay trước (cầm compa / chỉ)
    k = ik(S, hand, ARM, ARM, below);
    ctx.beginPath(); ctx.moveTo(S.x, S.y); ctx.lineTo(k.J.x, k.J.y); ctx.lineTo(k.E.x, k.E.y); ctx.stroke();
    ctx.fillStyle = '#1d2b4f'; ctx.beginPath(); ctx.arc(k.E.x, k.E.y, 7, 0, 7); ctx.fill();
    ctx.restore();

    if (bubble) drawBubble(fx - 10, HEAD_Y - 70, bubble.text, bubble.a);
  }

  function drawBubble(x, y, text, a) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = 'bold 28px "Times New Roman"';
    const w = ctx.measureText(text).width + 36, h = 50;
    const bx = Math.max(10, x - w / 2), by = y - h;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2f6fde'; ctx.lineWidth = 3;
    roundRect(bx, by, w, h, 18); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 6, by + h - 1); ctx.lineTo(x + 4, by + h + 18); ctx.lineTo(x + 18, by + h - 1);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 4, by + h - 4, 20, 5);
    ctx.fillStyle = '#1d2b4f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
    ctx.restore();
  }

  function drawCard(a) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#eef5ff'; ctx.strokeStyle = '#2f6fde'; ctx.lineWidth = 3;
    roundRect(350, 62, 262, 160, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2b4f'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 28px "Times New Roman"'; ctx.fillText('Đường tròn', 368, 92);
    ctx.font = 'bold italic 30px "Times New Roman"'; ctx.fillStyle = '#e8553a'; ctx.fillText('(O; R)', 518, 92);
    ctx.fillStyle = '#1d2b4f'; ctx.font = '26px "Times New Roman"';
    ctx.fillText('• Tâm: O', 368, 138);
    ctx.fillText('• Bán kính: R = 3 cm', 368, 180);
    ctx.restore();
  }

  function dashedLine(p, q, color, w) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash([12, 9]);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.restore();
  }
  function point(p, r = 6, color = '#1d2b4f') {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  }

  let clock = 0;
  function render(T) {
    const s = cv.width / W;
    ctx.setTransform(s, 0, 0, cv.height / H, 0, 0);
    const {i, t} = locate(T);
    let tr = 1, u = t;
    if (i > 0) { if (t < TR) { tr = ease(t / TR); u = 0; } else u = (t - TR) / (1 - TR); }
    const cur = stateOf(i, u);
    let fx = cur.fx, hand = cur.hand;
    if (tr < 1) { const pv = stateOf(i - 1, 1); fx = lerp(pv.fx, cur.fx, tr); hand = lerpP(pv.hand, cur.hand, tr); }

    drawRoom();
    // thước
    drawRuler(i < 2 ? 0 : (i === 2 ? tr : 1), (i === 2 ? clamp((u - 0.85) / 0.15) : (i === 3 ? 1 - u : 0)));
    // đường tròn đang vẽ
    if (i >= 4) {
      const end = i === 4 ? -2 * Math.PI * ease(u) : -2 * Math.PI;
      if (end < -0.001) {
        ctx.save(); ctx.strokeStyle = '#1f4fd1'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(O.x, O.y, R, 0, end, true); ctx.stroke(); ctx.restore();
      }
    }
    // bán kính OA
    if (i >= 5) {
      const pr = i === 5 ? ease(clamp((u - 0.15) / 0.45)) : 1;
      if (pr > 0) {
        const E = lerpP(O, A, pr);
        ctx.save(); ctx.strokeStyle = '#e8553a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(O.x, O.y); ctx.lineTo(E.x, E.y); ctx.stroke(); ctx.restore();
        if (pr >= 1) {
          point(A, 6);
          label('A', A.x + 22, A.y - 18);
          label('R = 3 cm', (O.x + A.x) / 2 - 30, (O.y + A.y) / 2 - 24, 28, '#e8553a');
        }
      }
    }
    // điểm M chạy trên đường tròn
    if (i === 6) {
      const ph = 2.3 - 2 * Math.PI * ease(clamp(u / 0.9));
      const M = {x: O.x + R * Math.cos(ph), y: O.y + R * Math.sin(ph)};
      dashedLine(O, M, '#1f9d6b', 4);
      point(M, 8, '#1f9d6b');
      label('M', O.x + (R + 28) * Math.cos(ph), O.y + (R + 28) * Math.sin(ph), 30, '#1f9d6b');
      label('OM = 3 cm', (O.x + M.x) / 2 + 22 * Math.sin(ph), (O.y + M.y) / 2 - 22 * Math.cos(ph) + 2, 26, '#1f9d6b');
    }
    // tâm O
    const dotOn = i > 1 || (i === 1 && u >= 0.45);
    if (dotOn) {
      const pop = i === 1 ? 1 + 0.8 * Math.max(0, 1 - (u - 0.45) / 0.15) : 1;
      point(O, 7 * pop);
      label('O', O.x - 26, O.y + 30);
    }
    // compa
    let ca = 0;
    if (i === 2) ca = tr; else if (i === 3 || i === 4) ca = 1; else if (i === 5) ca = 1 - tr;
    drawCompass(cur.compass, ca);
    // thẻ ghi nhớ
    drawCard(i === 5 ? clamp((u - 0.6) / 0.3) : (i === 6 ? 1 : 0));
    // nhân vật
    let bubble = null;
    if (i === 0 && u > 0.7) bubble = {text: 'Xin chào!', a: clamp((u - 0.7) / 0.08)};
    if (i === 5 && u > 0.55) bubble = {text: 'Xong rồi!', a: clamp((u - 0.55) / 0.1)};
    drawFigure(fx, hand, bubble);
  }

  // ====== Điều khiển ======
  let T = 0, playing = false, stopAt = null, speed = 1, voiceOn = true, curStep = -1, lastTs = null;
  const capEl = document.getElementById('cap'), dotsEl = document.getElementById('dots');
  STEPS.forEach((s, k) => {
    const d = document.createElement('div'); d.className = 'dot'; d.textContent = k;
    d.title = 'Đến cảnh ' + k;
    d.onclick = () => { T = STARTS[k]; playing = false; stopAt = null; speed = 1; prevFx = null; curStep = -1; speakCancel(); };
    dotsEl.appendChild(d);
  });

  let viVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    viVoice = vs.find(v => /^vi/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speakCancel() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function speak(text) {
    if (!voiceOn || speed !== 1 || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const ut = new SpeechSynthesisUtterance(text);
    ut.lang = 'vi-VN'; ut.rate = 0.95; if (viVoice) ut.voice = viVoice;
    speechSynthesis.speak(ut);
  }

  function onStep(i, announce) {
    capEl.innerHTML = STEPS[i].cap;
    [...dotsEl.children].forEach((d, k) => d.className = 'dot' + (k < i ? ' done' : (k === i ? ' now' : '')));
    if (announce) speak(STEPS[i].say);
  }

  const btnPlay = document.getElementById('btnPlay');
  function updatePlayBtn() { btnPlay.textContent = playing && stopAt === null ? '⏸ Tạm dừng' : '▶ Tự động'; }

  btnPlay.onclick = () => {
    if (playing && stopAt === null) { playing = false; speakCancel(); }
    else {
      if (T >= TOTAL - 1e-3) { T = 0; curStep = -1; prevFx = null; }
      playing = true; stopAt = null; speed = 1;
      if (curStep >= 0) speak(STEPS[curStep].say);
    }
  };
  document.getElementById('btnStep').onclick = () => {
    if (T >= TOTAL - 1e-3) { T = 0; curStep = -1; prevFx = null; }
    let {i} = locate(T);
    let end = STARTS[i] + STEPS[i].dur;
    if (T >= end - 2e-3 && i < STEPS.length - 1) { i++; end = STARTS[i] + STEPS[i].dur; }
    playing = true; speed = 1; stopAt = end - 1e-3;
    if (T < STARTS[i] + 1e-2 && curStep === i) speak(STEPS[i].say);
  };
  document.getElementById('btnFast').onclick = () => {
    speakCancel();
    if (T >= TOTAL - 1e-3) { T = 0; curStep = -1; prevFx = null; }
    playing = true; stopAt = null; speed = 4;
  };
  document.getElementById('btnReset').onclick = () => {
    speakCancel(); T = 0; playing = false; stopAt = null; speed = 1; curStep = -1; prevFx = null; walkW = 0;
  };
  const btnVoice = document.getElementById('btnVoice');
  btnVoice.onclick = () => {
    voiceOn = !voiceOn;
    btnVoice.textContent = voiceOn ? '🔊 Giọng đọc: Bật' : '🔇 Giọng đọc: Tắt';
    btnVoice.classList.toggle('off', !voiceOn);
    if (!voiceOn) speakCancel();
  };

  function frame(ts) {
    const dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts; clock += dt;
    if (playing) {
      let Tn = T + dt * speed;
      const {i} = locate(T), end = STARTS[i] + STEPS[i].dur;
      // chờ giọng đọc xong mới sang cảnh mới
      if (voiceOn && speed === 1 && 'speechSynthesis' in window && speechSynthesis.speaking && Tn >= end - 2e-3)
        Tn = Math.min(Tn, end - 2e-3);
      if (stopAt !== null && Tn >= stopAt) { Tn = stopAt; playing = false; stopAt = null; }
      if (Tn >= TOTAL) { Tn = TOTAL; playing = false; speed = 1; }
      T = Tn;
    }
    const {i} = locate(T);
    if (i !== curStep) { curStep = i; onStep(i, playing); }
    updatePlayBtn();
    render(T);
    requestAnimationFrame(frame);
  }

  // dùng cho kiểm thử
  window.__seek = x => { T = x; playing = false; prevFx = null; walkW = 0; };
  window.__total = TOTAL;

  resize(); onStep(0, false); curStep = 0;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
