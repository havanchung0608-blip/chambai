<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đấu trường Toán học</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   PHẦN THẦY SỬA: CẤU HÌNH + NGÂN HÀNG CÂU HỎI
   - Công thức viết LaTeX giữa hai dấu $...$ ; dùng R`...` để khỏi gõ \\ hai lần.
   - level: 1 = Nhận biết/Dễ, 2 = Thông hiểu/Vừa, 3 = Vận dụng/Khó
   - type:
       "mcq"  : trắc nghiệm 4 lựa chọn  -> options:[...], answer: chỉ số đúng (0=A,1=B,2=C,3=D)
       "tf"   : Đúng/Sai                -> answer: true hoặc false
       "num"  : điền số                 -> answer: số hoặc mảng số chấp nhận, tol: sai số (tuỳ chọn)
       "open" : trả lời miệng/tự luận   -> answer: đáp án dạng chữ, thầy bấm Đúng/Sai
   - hint: gợi ý (tuỳ chọn, dùng gợi ý thì điểm nhân hệ số CONFIG.hintFactor)
   - solution: các bước lời giải, mỗi lần bấm "Lời giải" hiện thêm 1 bước
   - time: số giây riêng cho câu đó (tuỳ chọn)
   ===================================================================== */
const R = String.raw;
const CONFIG = {
  title: "ĐẤU TRƯỜNG HẰNG ĐẲNG THỨC",
  subtitle: "Toán 8 – Luyện tập chung: Hằng đẳng thức đáng nhớ",
  teacher: "Thầy Hà Văn Chung",
  points: {1: 10, 2: 20, 3: 30},        // điểm theo mức độ
  time:   {1: 20, 2: 40, 3: 60},        // giây theo mức độ
  levelName: {1: "Dễ", 2: "Vừa", 3: "Khó"},
  hintFactor: 0.5,                      // dùng gợi ý: còn 50% điểm
  stealFactor: 0.5,                     // đội khác giành quyền: được 50% điểm
  stars: 2,                             // số ô "Ngôi sao hi vọng" (đúng x2, sai bị trừ)
  gifts: 2,                             // số ô "Hộp quà" (tặng ngay giftBonus điểm)
  giftBonus: 10,
  raceGoal: 0,                          // chế độ Đua về đích: điểm về đích (0 = tự tính theo số câu và số đội)
  hiddenText: "(a + b)² = a² + 2ab + b²", // chế độ Ô số: thông điệp ẩn sau các ô
  shuffle: true,                        // trộn câu trong cùng mức độ
  defaultTeams: ["Tổ 1", "Tổ 2", "Tổ 3", "Tổ 4"]
};

const QUESTIONS = [
  {level:1, type:"mcq", q:R`Khai triển $(a+b)^2$ ta được:`,
   options:[R`$a^2+b^2$`, R`$a^2+2ab+b^2$`, R`$a^2+ab+b^2$`, R`$a^2-2ab+b^2$`], answer:1,
   solution:[R`Bình phương của một tổng: $(a+b)^2=a^2+2ab+b^2$.`]},
  {level:1, type:"tf", q:R`Khẳng định: $(x-3)^2=x^2-9$.`, answer:false,
   solution:[R`$(x-3)^2=x^2-2\cdot x\cdot 3+3^2=x^2-6x+9\ne x^2-9$.`, R`Vậy khẳng định <b>Sai</b>.`]},
  {level:1, type:"mcq", q:R`Đa thức $x^2-16$ bằng:`,
   options:[R`$(x-4)^2$`, R`$(x-16)(x+16)$`, R`$(x-4)(x+4)$`, R`$(x-8)(x+8)$`], answer:2,
   solution:[R`Hiệu hai bình phương: $x^2-16=x^2-4^2=(x-4)(x+4)$.`]},
  {level:1, type:"mcq", q:R`Khai triển $(x+1)^3$ ta được:`,
   options:[R`$x^3+1$`, R`$x^3+3x^2+3x+1$`, R`$x^3+3x+1$`, R`$x^3-3x^2+3x-1$`], answer:1,
   solution:[R`Lập phương của một tổng: $(x+1)^3=x^3+3x^2\cdot1+3x\cdot1^2+1^3=x^3+3x^2+3x+1$.`]},
  {level:1, type:"tf", q:R`Khẳng định: $a^3-b^3=(a-b)(a^2+ab+b^2)$.`, answer:true,
   solution:[R`Đây chính là hằng đẳng thức hiệu hai lập phương. Khẳng định <b>Đúng</b>.`]},
  {level:2, type:"num", q:R`Tính nhanh: $101^2=\ ?$`, answer:10201,
   hint:R`Viết $101=100+1$.`,
   solution:[R`$101^2=(100+1)^2=100^2+2\cdot100\cdot1+1^2$`, R`$=10000+200+1=10201$.`]},
  {level:2, type:"num", q:R`Tính nhanh: $49\cdot 51=\ ?$`, answer:2499,
   hint:R`$49=50-1$ và $51=50+1$.`,
   solution:[R`$49\cdot51=(50-1)(50+1)=50^2-1^2$`, R`$=2500-1=2499$.`]},
  {level:2, type:"mcq", q:R`Điền số thích hợp vào ô trống: $x^2+6x+\square=(x+3)^2$`,
   options:[R`$3$`, R`$6$`, R`$9$`, R`$36$`], answer:2,
   solution:[R`$(x+3)^2=x^2+2\cdot x\cdot3+3^2=x^2+6x+9$.`, R`Ô trống là $9$.`]},
  {level:2, type:"num", q:R`Tính giá trị của biểu thức $x^2-4x+4$ tại $x=102$.`, answer:10000,
   hint:R`Viết biểu thức dưới dạng bình phương của một hiệu.`,
   solution:[R`$x^2-4x+4=(x-2)^2$.`, R`Tại $x=102$: $(102-2)^2=100^2=10000$.`]},
  {level:2, type:"mcq", q:R`Đa thức $8x^3-1$ bằng:`,
   options:[R`$(2x-1)(4x^2-2x+1)$`, R`$(2x-1)(4x^2+2x+1)$`, R`$(2x+1)(4x^2-2x+1)$`, R`$(2x-1)^3$`], answer:1,
   solution:[R`$8x^3-1=(2x)^3-1^3$`, R`$=(2x-1)\big[(2x)^2+2x\cdot1+1^2\big]=(2x-1)(4x^2+2x+1)$.`]},
  {level:2, type:"tf", q:R`Khẳng định: $(2x+y)(2x-y)=4x^2-y^2$.`, answer:true,
   solution:[R`$(2x+y)(2x-y)=(2x)^2-y^2=4x^2-y^2$. Khẳng định <b>Đúng</b>.`]},
  {level:3, type:"num", q:R`Tìm $x$, biết $(x+2)^2-(x-2)^2=16$.`, answer:2,
   hint:R`Dùng hiệu hai bình phương hoặc khai triển hai bình phương.`,
   solution:[R`$(x+2)^2-(x-2)^2=(x^2+4x+4)-(x^2-4x+4)=8x$.`, R`$8x=16$, suy ra $x=2$.`]},
  {level:3, type:"num", q:R`Tìm giá trị nhỏ nhất của biểu thức $A=x^2-6x+11$.`, answer:2,
   hint:R`Tách $11=9+2$.`,
   solution:[R`$A=x^2-6x+9+2=(x-3)^2+2$.`, R`Vì $(x-3)^2\ge 0$ với mọi $x$ nên $A\ge 2$.`, R`Dấu "=" xảy ra khi $x=3$. Giá trị nhỏ nhất của $A$ là $2$.`]},
  {level:3, type:"open", q:R`Chứng minh rằng: $(a+b)^2-(a-b)^2=4ab$.`,
   answer:R`Biến đổi vế trái bằng vế phải.`,
   solution:[R`Vế trái $=(a^2+2ab+b^2)-(a^2-2ab+b^2)$`, R`$=a^2+2ab+b^2-a^2+2ab-b^2=4ab=$ Vế phải.`]},
  {level:3, type:"num", q:R`Cho $x+y=5$ và $xy=6$. Tính $x^2+y^2$.`, answer:13,
   hint:R`$x^2+y^2=(x+y)^2-2xy$.`,
   solution:[R`$x^2+y^2=(x+y)^2-2xy=5^2-2\cdot6=25-12=13$.`]},
  {level:3, type:"num", q:R`Cho $x+y=5$ và $xy=6$. Tính $x^3+y^3$.`, answer:35,
   hint:R`$x^3+y^3=(x+y)^3-3xy(x+y)$.`,
   solution:[R`$x^3+y^3=(x+y)^3-3xy(x+y)$`, R`$=5^3-3\cdot6\cdot5=125-90=35$.`]}
];
/* ======================= HẾT PHẦN THẦY SỬA ======================= */
</script>
<style>
:root{
  --bg1:#0b1d4a; --bg2:#1d3b8b; --card:#ffffff; --ink:#1b2340; --muted:#5b6587;
  --gold:#ffc83d; --pink:#ff5d8f; --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
  --l1:#22c55e; --l2:#f59e0b; --l3:#ef4444;
  --optA:#e11d48; --optB:#2563eb; --optC:#d97706; --optD:#059669;
  --ui:'Baloo 2','Segoe UI',Arial,sans-serif; --math:'Times New Roman',Times,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);color:#fff;background:radial-gradient(circle at 20% 10%,#2b5fd9 0,transparent 45%),radial-gradient(circle at 85% 90%,#8b2bd9 0,transparent 40%),linear-gradient(135deg,var(--bg1),var(--bg2));background-color:var(--bg1);overflow-x:hidden;min-height:100vh}
button{font-family:var(--ui);cursor:pointer;border:none}
.hidden{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}
/* Thanh trên */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.topbar h1{font-size:clamp(20px,2.4vw,34px);font-weight:800;letter-spacing:.5px;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.topbar .sub{font-size:clamp(14px,1.3vw,20px);opacity:.85;font-weight:500}
.ibtn{background:rgba(255,255,255,.15);color:#fff;font-size:22px;width:48px;height:48px;border-radius:14px;transition:.2s}
.ibtn:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
/* Màn hình bắt đầu */
#start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px;text-align:center}
.logo{font-size:clamp(34px,5.5vw,78px);font-weight:800;line-height:1.05;background:linear-gradient(90deg,#ffe27a,#ffb02e,#ff6fa3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.tagline{font-size:clamp(18px,2vw,28px);opacity:.92}
.teacher{font-size:clamp(15px,1.4vw,20px);opacity:.75}
.setup{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:18px 22px;width:min(1100px,100%)}
.setup h3{font-size:clamp(20px,1.8vw,26px);margin-bottom:10px}
.teamrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.teamrow input{font-family:var(--ui);font-size:20px;font-weight:700;width:150px;padding:8px 12px;border-radius:12px;border:3px solid transparent;text-align:center;color:var(--ink)}
.cnt{display:flex;align-items:center;gap:8px;font-size:20px}
.cnt button{width:42px;height:42px;border-radius:12px;font-size:24px;font-weight:800;background:var(--gold);color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:min(1100px,100%)}
.mode{background:#fff;color:var(--ink);border-radius:24px;padding:20px 18px;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:.2s;border:4px solid transparent}
.mode:hover{transform:translateY(-6px);border-color:var(--gold)}
.mode .ic{font-size:52px}
.mode h2{font-size:clamp(22px,2vw,30px);font-weight:800;margin:4px 0}
.mode p{font-size:clamp(15px,1.25vw,19px);color:var(--muted);line-height:1.35}
/* Màn hình chơi */
#game{flex:1;display:flex;gap:16px;padding:16px 20px}
#board{flex:1;display:flex;flex-direction:column;min-width:0}
#scores{width:300px;display:flex;flex-direction:column;gap:10px}
.team{background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.25);border:4px solid transparent;transition:.3s}
.team.turn{border-color:var(--gold);transform:scale(1.04);box-shadow:0 0 0 6px rgba(255,200,61,.35),0 5px 0 rgba(0,0,0,.25)}
.team .av{font-size:34px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.team .nm{font-size:20px;font-weight:800;line-height:1.1}
.team .pt{font-size:30px;font-weight:800;margin-left:auto;min-width:60px;text-align:right}
.team .adj{display:flex;flex-direction:column;gap:3px}
.team .adj button{width:30px;height:24px;border-radius:7px;font-weight:800;font-size:16px;background:#eef1fb;color:var(--ink)}
.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.35);color:var(--green)}}
.turnbox{background:rgba(255,200,61,.18);border:2px dashed var(--gold);border-radius:16px;padding:10px;text-align:center;font-size:20px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:clamp(17px,1.4vw,22px);font-weight:800;padding:10px 18px;border-radius:14px;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:.15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.gold{background:var(--gold);color:var(--ink)} .btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.pink{background:var(--pink)} .btn.ghost{background:rgba(255,255,255,.18)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* Ô số */
.tilewrap{position:relative;flex:1;border-radius:24px;overflow:hidden;min-height:360px}
.hiddenmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-size:clamp(34px,5vw,80px);font-weight:800;color:#fff;background:linear-gradient(135deg,#ff6fa3,#ffb02e,#7c3aed);text-shadow:0 4px 0 rgba(0,0,0,.3)}
.grid{position:absolute;inset:0;display:grid;gap:10px;padding:10px}
.tile{border-radius:18px;font-size:clamp(28px,3.6vw,56px);font-weight:800;color:var(--ink);background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);position:relative;transition:transform .5s,opacity .5s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .lv{position:absolute;bottom:8px;left:0;right:0;font-size:clamp(12px,1vw,16px);letter-spacing:2px}
.tile.l1{border-bottom:8px solid var(--l1)} .tile.l2{border-bottom:8px solid var(--l2)} .tile.l3{border-bottom:8px solid var(--l3)}
.tile.open{transform:rotateY(90deg) scale(.6);opacity:0;pointer-events:none}
/* Đua về đích */
.race{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center;background:rgba(255,255,255,.08);border-radius:24px;padding:18px}
.lane{position:relative;height:74px;border-radius:40px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 40px,rgba(255,255,255,.04) 40px 80px);border:3px solid rgba(255,255,255,.25)}
.lane .flag{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:40px}
.lane .runner{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:46px;transition:left 1.2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 4px 2px rgba(0,0,0,.4))}
.lane .lname{position:absolute;left:18px;top:-2px;font-size:16px;font-weight:800;opacity:.9}
.pick{display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pick .btn{font-size:clamp(20px,1.8vw,28px);padding:14px 26px}
/* Vượt ải */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(255,255,255,.08);border-radius:24px;padding:20px;text-align:center}
.stage h2{font-size:clamp(34px,4.5vw,64px);font-weight:800;color:var(--gold)}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:rgba(255,255,255,.18)}
.dot.done{background:var(--green)} .dot.now{background:var(--gold);color:var(--ink);transform:scale(1.2)}
/* Hộp câu hỏi */
#qmodal{position:fixed;inset:0;background:rgba(5,10,30,.72);display:grid;place-items:center;z-index:50;padding:12px}
.qbox{background:#fff;color:var(--ink);border-radius:28px;width:min(1400px,98vw);max-height:96vh;overflow:auto;padding:20px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{font-size:20px;font-weight:800;padding:4px 14px;border-radius:30px;color:#fff}
.who{font-size:22px;font-weight:800;color:var(--muted)}
.timer{margin-left:auto;position:relative;width:92px;height:92px}
.timer svg{transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800}
.timer.warn .num{color:var(--red);animation:blink .5s infinite alternate}
@keyframes blink{to{transform:scale(1.15)}}
.qtext{font-family:var(--math);font-size:clamp(30px,3vw,46px);line-height:1.4;margin:14px 0 18px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{font-family:var(--math);font-size:clamp(26px,2.5vw,38px);text-align:left;padding:14px 18px;border-radius:18px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:.2s;min-height:80px}
.opt .k{font-family:var(--ui);font-weight:800;background:rgba(255,255,255,.3);border-radius:12px;width:52px;height:52px;flex:none;display:grid;place-items:center;font-size:28px}
.opt:hover{transform:translateY(-3px)}
.opt.correct{outline:6px solid var(--gold);animation:bump .6s;transform:scale(1.02)}
.opt.wrong{opacity:.35;filter:grayscale(.8)}
.opt.chosen{outline:6px solid #111}
.numin{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.numin input{font-family:var(--math);font-size:40px;width:min(360px,100%);padding:8px 16px;border:4px solid #c7cff0;border-radius:16px;color:var(--ink)}
.reveal{margin-top:16px;padding:14px 18px;border-radius:18px;background:#fff7d6;border:3px solid var(--gold);font-family:var(--math);font-size:clamp(26px,2.4vw,36px);line-height:1.45}
.reveal b.lab{font-family:var(--ui);color:#b45309}
.sol{margin-top:12px;padding:12px 18px;border-radius:18px;background:#eef6ff;border:3px solid #93c5fd;font-family:var(--math);font-size:clamp(24px,2.2vw,34px);line-height:1.5}
.sol div{animation:pop .3s}
.hintbox{margin-top:12px;padding:10px 18px;border-radius:16px;background:#f3e8ff;border:3px dashed #a855f7;font-family:var(--math);font-size:clamp(24px,2.2vw,32px)}
.qctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.fm{font-family:var(--math);white-space:nowrap}
.fm i{font-style:italic;padding-right:1px}
.fm sup,.fm sub{font-size:.65em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.hat{position:relative;display:inline-block}
.hat::before{content:"^";position:absolute;left:0;right:0;top:-.55em;text-align:center;font-style:normal}
.result{font-size:clamp(30px,3vw,46px);font-weight:800;text-align:center;margin-top:12px;animation:pop .4s}
.result.ok{color:var(--green)} .result.no{color:var(--red)}
.judge{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px;border-radius:16px;background:#f1f5f9}
.judge span{font-size:22px;font-weight:800;margin-right:6px}
.chk{font-size:20px;font-weight:800;padding:8px 16px;border-radius:14px;background:#e2e8f0;color:var(--ink);border:3px solid transparent}
.chk.on{background:var(--green);color:#fff;border-color:#15803d}
.effect{font-size:22px;font-weight:800;padding:4px 14px;border-radius:30px;background:#fff1c2;color:#92400e}
/* Kết thúc */
#end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center}
.podium{display:flex;align-items:flex-end;gap:18px;justify-content:center}
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(220px,28vw)}
.pcol .pav{font-size:56px}
.pcol .pnm{font-size:clamp(20px,2vw,30px);font-weight:800}
.pcol .bar{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:center;font-size:clamp(28px,3vw,48px);font-weight:800;color:var(--ink);animation:grow 1s ease-out}
@keyframes grow{from{height:0!important}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:clamp(30px,4vw,60px);font-weight:800;padding:16px 36px;border-radius:24px;background:#fff;color:var(--ink);z-index:80;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:pop .4s;text-align:center}

.help{font-size:15px;opacity:.7;text-align:center;padding:6px}

  #game{flex-direction:column;padding:12px 16px}
  #scores{width:100%;flex-direction:row;flex-wrap:wrap}
  .team{flex:1 1 200px}
  .modes{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .qbox{padding:16px}
  .timer{width:70px;height:70px}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="ttl"></h1>
    <span class="sub" id="sub"></span>
    <button class="ibtn" id="bHome" title="Màn hình chính">🏠</button>
    <button class="ibtn" id="bMute" title="Bật/tắt âm thanh (M)">🔊</button>
    <button class="ibtn" id="bFull" title="Toàn màn hình (F)">⛶</button>
  </div>

  <section id="start">
    <div class="logo" id="logo"></div>
    <div class="tagline" id="tag"></div>
    <div class="teacher" id="tch"></div>
    <div class="setup">
      <h3>👥 Các đội chơi</h3>
      <div class="teamrow" id="teamInputs"></div>
      <div class="cnt" style="justify-content:center;margin-top:10px">
        <span>Số đội:</span><button id="tMinus">−</button><b id="tCount"></b><button id="tPlus">+</button>
      </div>
    </div>
    <div class="modes">
      <button class="mode" data-mode="tile"><div class="ic">🎁</div><h2>Ô số may mắn</h2><p>Các đội lần lượt chọn ô số. Mỗi ô là một câu hỏi, có ô <b>Ngôi sao hi vọng</b> và <b>Hộp quà</b>. Mở hết ô để thấy thông điệp bí mật.</p></button>
      <button class="mode" data-mode="race"><div class="ic">🏁</div><h2>Đua về đích</h2><p>Đến lượt, đội tự chọn câu <b>Dễ – Vừa – Khó</b>. Trả lời đúng, nhân vật tiến lên. Đội đầu tiên về đích giành chiến thắng.</p></button>
      <button class="mode" data-mode="all"><div class="ic">⛰️</div><h2>Vượt ải cả lớp</h2><p>Tất cả đội cùng trả lời một câu trên bảng con qua 3 ải: <b>Khởi động – Tăng tốc – Về đích</b>. Thầy đánh dấu các đội đúng.</p></button>
    </div>
    <div class="help">Phím tắt: <b>Space</b> hiện đáp án/câu tiếp • <b>1–4</b> chọn A–D • <b>P</b> tạm dừng • <b>F</b> toàn màn hình • <b>M</b> tắt tiếng • <b>Esc</b> đóng câu hỏi</div>
  </section>

  <section id="game" class="hidden">
    <div id="board"></div>
    <aside id="scores"></aside>
  </section>

  <section id="end" class="hidden"></section>
</div>

<div id="qmodal" class="hidden"><div class="qbox" id="qbox"></div></div>
<canvas id="fx"></canvas>

<script>
/* ============================ ENGINE ============================ */
const $ = s => document.querySelector(s);
const AV = ["🚀","🦄","🐯","🐬","🦊","🐼"];
const COL = ["#fde68a","#bfdbfe","#fecaca","#bbf7d0","#e9d5ff","#fed7aa"];
const LVCOL = {1:"var(--l1)",2:"var(--l2)",3:"var(--l3)"};
let teamNames = CONFIG.defaultTeams.slice(0, 6);
let S = null;            // trạng thái ván chơi
let Q = null;            // trạng thái câu hỏi đang mở
let muted = false;

/* ---------- Âm thanh Web Audio (không cần file) ---------- */
let AC = null;
function tone(f, d, type="sine", v=.18, delay=0){
  if (muted) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  }catch(e){}
}
const SND = {
  click(){tone(660,.08,"square",.08)},
  tick(){tone(1000,.05,"square",.06)},
  open(){[523,659,784].forEach((f,i)=>tone(f,.15,"triangle",.15,i*.07))},
  ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.2,i*.09))},
  no(){tone(220,.35,"sawtooth",.15);tone(160,.45,"sawtooth",.12,.18)},
  up(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,"triangle",.18,i*.1))},
  timeout(){[600,450,300].forEach((f,i)=>tone(f,.25,"square",.12,i*.15))}
};

/* ---------- Tiện ích ---------- */
function renderMath(el){
  if (window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false}); return; }catch(e){}
  }
  fallbackMath(el);   // không có mạng: tự hiển thị công thức đơn giản
}
/* Bộ hiển thị LaTeX dự phòng (khi không tải được KaTeX) */
const SYM = {cdot:"·",times:"×",div:":",le:"≤",leq:"≤",ge:"≥",geq:"≥",ne:"≠",neq:"≠",pm:"±",square:"□",Rightarrow:"⇒",in:"∈",notin:"∉",
  pi:"π",alpha:"α",beta:"β",gamma:"γ",angle:"∠",triangle:"△",perp:"⊥",parallel:"∥",circ:"°",infty:"∞",approx:"≈",lt:"<",gt:">",
  subset:"⊂",cup:"∪",cap:"∩",varnothing:"∅",emptyset:"∅",mathbb:"",backsim:"∽",sim:"∽",equiv:"≡",dots:"…",ldots:"…",quad:"  ",qquad:"    "};
function texToHtml(s){
  let i = 0;
  const esc = c => c==="<"?"&lt;":c===">"?"&gt;":c==="&"?"&amp;":c;
  function group(){
    while (s[i]===" ") i++;
    if (s[i]==="{"){ let d=1, j=++i; while (j<s.length && d){ if (s[j]==="{") d++; else if (s[j]==="}") d--; j++; } const g=s.slice(i,j-1); i=j; return g; }
    if (s[i]==="\\"){ let j=i+1; while (j<s.length && /[a-zA-Z]/.test(s[j])) j++; if (j===i+1) j++; const g=s.slice(i,j); i=j; return g; }
    return s[i++] || "";
  }
  function run(){
    let out = "";
    while (i < s.length){
      const c = s[i];
      if (c==="\\"){
        let j=i+1; while (j<s.length && /[a-zA-Z]/.test(s[j])) j++;
        const name = j===i+1 ? s[j++] : s.slice(i+1,j); i=j;
        if (name==="frac"||name==="dfrac"){ const a=texToHtml(group()), b=texToHtml(group()); out+=`<span class="fr"><span>${a}</span><span>${b}</span></span>`; }
        else if (name==="sqrt"){ out+=`√<span style="border-top:2px solid currentColor">${texToHtml(group())}</span>`; }
        else if (name==="widehat"||name==="hat"){ out+=`<span class="hat">${texToHtml(group())}</span>`; }
        else if (name==="overline"){ out+=`<span style="border-top:2px solid currentColor">${texToHtml(group())}</span>`; }
        else if (name==="text"||name==="mathrm"||name==="textbf"){ out+=group(); }
        else if (/^(left|right|big|Big|bigl|bigr|Bigl|Bigr|displaystyle)$/.test(name)){ }
        else if (name===","||name===";"||name===" "||name==="!"){ out+=" "; }
        else if (name in SYM) out+=SYM[name];
        else out+=esc(name);
      } else if (c==="^"||c==="_"){ i++; const g=texToHtml(group()); out+= c==="^"?`<sup>${g}</sup>`:`<sub>${g}</sub>`; }
      else if (c==="{"||c==="}"){ i++; }
      else if (/[a-zA-Z]/.test(c)){ out+=`<i>${c}</i>`; i++; }
      else if ("=+-<>".includes(c)){ out+="\u2009"+(c==="-"?"−":esc(c))+"\u2009"; i++; }
      else { out+=esc(c); i++; }
    }
    return out;
  }
  return run();
}
function fallbackMath(el){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) if (w.currentNode.nodeValue.includes("$")) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const html = n.nodeValue.split(/(\$\$?[^$]+\$\$?)/g).map(part=>{
      const m = part.match(/^\$\$?([^$]+)\$\$?$/);
      return m ? `<span class="fm">${texToHtml(m[1])}</span>` : part.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    }).join("");
    const sp = document.createElement("span"); sp.innerHTML = html; n.replaceWith(sp);
  });
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(html, ms=1600){
  const t = document.createElement("div"); t.className="toast"; t.innerHTML=html;
  document.body.appendChild(t); renderMath(t); setTimeout(()=>t.remove(), ms);
}
function parseNum(s){
  s = String(s).trim().replace(/\s+/g,"").replace(",",".").replace("−","-");
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){ const [a,b]=s.split("/").map(Number); return b===0?NaN:a/b; }
  return s==="" ? NaN : Number(s);
}
function show(id){ ["start","game","end"].forEach(x=>$("#"+x).classList.toggle("hidden", x!==id)); }

/* ---------- Màn hình bắt đầu ---------- */
function initStart(){
  $("#ttl").textContent = CONFIG.title; $("#sub").textContent = CONFIG.teacher;
  $("#logo").textContent = CONFIG.title; $("#tag").textContent = CONFIG.subtitle;
  $("#tch").textContent = "Giáo viên: " + CONFIG.teacher + " • " + QUESTIONS.length + " câu hỏi";
  document.title = CONFIG.title;
  drawTeamInputs(); show("start");
}
function drawTeamInputs(){
  const box = $("#teamInputs"); box.innerHTML = "";
  teamNames.forEach((n,i)=>{
    const inp = document.createElement("input"); inp.value = n; inp.style.background = COL[i];
    inp.oninput = () => teamNames[i] = inp.value || ("Đội " + (i+1));
    box.appendChild(inp);
  });
  $("#tCount").textContent = teamNames.length;
}
$("#tMinus").onclick = () => { if (teamNames.length>2){ teamNames.pop(); drawTeamInputs(); SND.click(); } };
$("#tPlus").onclick  = () => { if (teamNames.length<6){ teamNames.push("Đội "+(teamNames.length+1)); drawTeamInputs(); SND.click(); } };
document.querySelectorAll(".mode").forEach(b => b.onclick = () => startGame(b.dataset.mode));

/* ---------- Bắt đầu ván ---------- */
function startGame(mode){
  SND.open();
  const qs = QUESTIONS.map((q,i)=>({...q, id:i}));
  const byLv = {1:[],2:[],3:[]};
  qs.forEach(q => (byLv[q.level] || byLv[1]).push(q));
  if (CONFIG.shuffle) Object.values(byLv).forEach(shuffle);
  S = { mode, turn:0, done:new Set(), byLv,
        teams: teamNames.map((n,i)=>({name:n.trim()||("Đội "+(i+1)), score:0, av:AV[i], col:COL[i]})) };
  if (mode==="tile"){
    // Ô số: xếp câu Dễ trước, Khó sau rồi trộn vị trí; gán ô đặc biệt ngẫu nhiên
    S.tiles = shuffle([...byLv[1],...byLv[2],...byLv[3]]).map(q=>({q, effect:null, open:false}));
    const idx = shuffle(S.tiles.map((_,i)=>i));
    idx.slice(0, CONFIG.stars).forEach(i => S.tiles[i].effect = "star");
    idx.slice(CONFIG.stars, CONFIG.stars + CONFIG.gifts).forEach(i => S.tiles[i].effect = "gift");
  }
  const totalPts = qs.reduce((t,q)=>t+(CONFIG.points[q.level]||0),0);
  S.goal = CONFIG.raceGoal > 0 ? CONFIG.raceGoal : Math.max(30, Math.round(totalPts / S.teams.length * 0.8 / 10) * 10);
  if (mode==="all"){ S.seq = [...byLv[1],...byLv[2],...byLv[3]]; S.pos = -1; }
  show("game"); renderBoard(); renderScores();
}

/* ---------- Bảng điểm ---------- */
function renderScores(bumpIdx=-1){
  const box = $("#scores"); box.innerHTML = "";
  if (S.mode!=="all"){
    const tb = document.createElement("div"); tb.className="turnbox";
    tb.innerHTML = `Lượt: <b>${S.teams[S.turn].av} ${S.teams[S.turn].name}</b>`; box.appendChild(tb);
  }
  S.teams.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "team" + (S.mode!=="all" && i===S.turn ? " turn" : "");
    d.innerHTML = `<div class="av" style="background:${t.col}">${t.av}</div><div class="nm">${t.name}</div>
      <div class="pt ${i===bumpIdx?'bump':''}">${t.score}</div>
      <div class="adj"><button title="+10">+</button><button title="−10">−</button></div>`;
    const [p,m] = d.querySelectorAll(".adj button");
    p.onclick = () => { addScore(i, 10); };
    m.onclick = () => { addScore(i, -10); };
    box.appendChild(d);
  });
  const c = document.createElement("div"); c.className="ctrl"; c.style.marginTop="auto";
  c.innerHTML = `<button class="btn pink" id="bEnd">🏆 Kết thúc</button><button class="btn ghost" id="bRestart">↺ Làm lại</button>`;
  box.appendChild(c);
  $("#bEnd").onclick = () => { if (confirm("Kết thúc trò chơi và xem kết quả?")) endGame(); };
  $("#bRestart").onclick = () => { if (confirm("Chơi lại từ đầu? Điểm hiện tại sẽ mất.")) startGame(S.mode); };
}
function addScore(i, pts){
  S.teams[i].score = Math.max(0, S.teams[i].score + pts);
  renderScores(i);
  if (S.mode==="race") renderBoard();
}

/* ---------- Bàn chơi theo chế độ ---------- */
function renderBoard(){
  const b = $("#board"); b.innerHTML = "";
  if (S.mode==="tile"){
    const n = S.tiles.length; let cols = 4, best = 1e9;
    for (let c=3; c<=8; c++){ const r = Math.ceil(n/c), sc = (r*c-n)*2 + Math.abs(c/r - 1.8); if (sc < best){ best = sc; cols = c; } }
    b.innerHTML = `<div class="tilewrap"><div class="hiddenmsg" id="hmsg"></div><div class="grid" id="grid"></div></div>`;
    $("#hmsg").textContent = CONFIG.hiddenText;
    const g = $("#grid"); g.style.gridTemplateColumns = `repeat(${cols},1fr)`;
    S.tiles.forEach((t,i)=>{
      const el = document.createElement("button");
      el.className = "tile l" + t.q.level + (t.open ? " open" : "");
      el.innerHTML = `${i+1}<div class="lv">${"★".repeat(t.q.level)}</div>`;
      el.onclick = () => openTile(i);
      g.appendChild(el);
    });
  }
  if (S.mode==="race"){
    const r = document.createElement("div"); r.className="race";
    S.teams.forEach((t)=>{
      const pct = Math.min(100, t.score / S.goal * 100);
      r.innerHTML += `<div class="lane"><span class="lname">${t.name} – ${t.score}/${S.goal}</span><span class="flag">🏁</span>
        <span class="runner" style="left:calc(40px + (100% - 110px) * ${pct/100})">${t.av}</span></div>`;
    });
    b.appendChild(r);
    const p = document.createElement("div"); p.className="pick";
    p.innerHTML = `<div style="width:100%;text-align:center;font-size:24px;font-weight:800">${S.teams[S.turn].av} ${S.teams[S.turn].name} chọn câu hỏi:</div>`;
    [1,2,3].forEach(lv=>{
      const left = S.byLv[lv].filter(q=>!S.done.has(q.id)).length;
      const bt = document.createElement("button"); bt.className="btn";
      bt.style.background = LVCOL[lv]; bt.disabled = left===0;
      bt.innerHTML = `${CONFIG.levelName[lv]} • ${CONFIG.points[lv]} điểm <small>(còn ${left})</small>`;
      bt.onclick = () => { const q = S.byLv[lv].find(q=>!S.done.has(q.id)); openQuestion(q, {team:S.turn}); };
      p.appendChild(bt);
    });
    b.appendChild(p);
  }
  if (S.mode==="all"){
    const st = document.createElement("div"); st.className="stage";
    const next = S.seq[S.pos+1];
    const name = {1:"Ải 1 • KHỞI ĐỘNG",2:"Ải 2 • TĂNG TỐC",3:"Ải 3 • VỀ ĐÍCH"};
    st.innerHTML = next
      ? `<h2>${name[next.level]}</h2><div style="font-size:26px">Câu ${S.pos+2}/${S.seq.length} • ${CONFIG.points[next.level]} điểm • ${next.time||CONFIG.time[next.level]} giây</div>`
      : `<h2>Đã hoàn thành các ải!</h2>`;
    const dots = document.createElement("div"); dots.className="dots";
    S.seq.forEach((q,i)=>{ dots.innerHTML += `<div class="dot ${i<=S.pos?'done':''} ${i===S.pos+1?'now':''}" style="${i>S.pos+1?'border:3px solid '+LVCOL[q.level]:''}">${i+1}</div>`; });
    st.appendChild(dots);
    const bt = document.createElement("button"); bt.className="btn gold"; bt.style.fontSize="30px"; bt.style.padding="14px 40px";
    bt.textContent = next ? "▶ Mở câu hỏi" : "🏆 Xem kết quả";
    bt.id = "bNextQ";
    bt.onclick = () => { if (!next) return endGame(); S.pos++; openQuestion(next, {team:-1}); };
    st.appendChild(bt); b.appendChild(st);
  }
}
function openTile(i){
  const t = S.tiles[i]; if (t.open || S.over || Q) return;
  const ctx = {team:S.turn, tile:i, effect:t.effect};
  if (t.effect==="gift"){
    S.teams[S.turn].score += CONFIG.giftBonus; renderScores(S.turn); SND.up();
    toast(`🎁 HỘP QUÀ!<br>${S.teams[S.turn].name} được tặng ${CONFIG.giftBonus} điểm`, 1800);
    setTimeout(()=>openQuestion(t.q, ctx), 1700);
  } else if (t.effect==="star"){
    SND.up(); toast(`⭐ NGÔI SAO HI VỌNG!<br><span style="font-size:.6em">Đúng: nhân đôi điểm • Sai: bị trừ điểm</span>`, 2000);
    setTimeout(()=>openQuestion(t.q, ctx), 1900);
  } else openQuestion(t.q, ctx);
}

/* ---------- Hộp câu hỏi ---------- */
function openQuestion(q, ctx){
  if (!q || S.over) return;
  SND.open();
  const all = ctx.team < 0;
  Q = { q, ctx, all, judged:false, revealed:false, hint:false, solStep:0, paused:false,
        total:q.time || CONFIG.time[q.level], left:q.time || CONFIG.time[q.level],
        base:CONFIG.points[q.level], picks:new Set(), lastTick:-1 };
  const box = $("#qbox");
  const lv = q.level, who = all ? "👥 Tất cả các đội" : `${S.teams[ctx.team].av} ${S.teams[ctx.team].name}`;
  const eff = ctx.effect==="star" ? `<span class="effect">⭐ Nhân đôi</span>` : ctx.effect==="gift" ? `<span class="effect">🎁 Hộp quà</span>` : "";
  const label = ctx.tile!==undefined ? `Ô số ${ctx.tile+1}` : all ? `Câu ${S.pos+1}/${S.seq.length}` : "Câu hỏi";
  let body = "";
  if (q.type==="mcq" || q.type==="tf"){
    const opts = q.type==="tf" ? ["Đúng","Sai"] : q.options;
    body = `<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" style="background:${["var(--optA)","var(--optB)","var(--optC)","var(--optD)"][i]}"><span class="k">${q.type==="tf"?(i?"S":"Đ"):"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>`;
  } else if (q.type==="num"){
    body = `<div class="numin"><input id="numIn" inputmode="decimal" placeholder="Nhập đáp số" autocomplete="off">${all?"":`<button class="btn green" id="bCheck">✔ Kiểm tra</button>`}</div>`;
  } else {
    body = `<div style="font-size:24px;color:var(--muted)">💬 Đội trình bày câu trả lời, thầy bấm <b>Hiện đáp án</b> rồi chấm.</div>`;
  }
  box.innerHTML = `
    <div class="qhead">
      <span class="badge" style="background:${LVCOL[lv]}">${label} • ${CONFIG.levelName[lv]} • ${Q.base} điểm</span>
      ${eff}<span class="who">${who}</span>
      <div class="timer" id="timer"><svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="44" stroke="#e5e7eb" stroke-width="10" fill="none"/><circle id="ring" cx="50" cy="50" r="44" stroke="var(--green)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="num" id="tnum">${Q.left}</div></div>
    </div>
    <div class="qtext">${q.q}</div>
    ${body}
    <div id="hintArea"></div><div id="revArea"></div><div id="resArea"></div><div id="judgeArea"></div><div id="solArea"></div>
    <div class="qctrl">
      ${q.hint ? `<button class="btn" style="background:#a855f7" id="bHint">💡 Gợi ý</button>` : ""}
      <button class="btn ghost" style="background:#64748b" id="bPause">⏸ Tạm dừng</button>
      <button class="btn gold" id="bReveal">👁 Hiện đáp án</button>
      ${q.solution && q.solution.length ? `<button class="btn" id="bSol">📖 Lời giải</button>` : ""}
      <button class="btn pink" id="bClose" style="margin-left:auto">✖ Đóng câu</button>
    </div>`;
  $("#qmodal").classList.remove("hidden");
  renderMath(box);
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => chooseOpt(+b.dataset.i));
  const ni = $("#numIn");
  if (ni){ ni.focus(); ni.onkeydown = e => { if (e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); if (!all) checkNum(); else reveal(); } }; }
  if ($("#bCheck")) $("#bCheck").onclick = checkNum;
  if ($("#bHint")) $("#bHint").onclick = showHint;
  $("#bPause").onclick = togglePause;
  $("#bReveal").onclick = reveal;
  if ($("#bSol")) $("#bSol").onclick = nextSol;
  $("#bClose").onclick = closeQuestion;
  startTimer();
}
function startTimer(){
  stopTimer(); const t0 = Date.now(), start = Q.left;
  Q.iv = setInterval(()=>{
    if (Q.paused) return;
    Q.left = Math.max(0, start - (Date.now()-t0)/1000);
    const s = Math.ceil(Q.left), ring = $("#ring");
    $("#tnum").textContent = s;
    ring.style.strokeDashoffset = 276.5 * (1 - Q.left/Q.total);
    ring.style.stroke = Q.left/Q.total > .5 ? "var(--green)" : Q.left/Q.total > .2 ? "var(--l2)" : "var(--red)";
    $("#timer").classList.toggle("warn", s<=5);
    if (s<=5 && s>0 && s!==Q.lastTick){ Q.lastTick = s; SND.tick(); }
    if (Q.left<=0){ stopTimer(); onTimeout(); }
  }, 100);
}
function stopTimer(){ if (Q && Q.iv){ clearInterval(Q.iv); Q.iv=null; } }
function togglePause(){
  if (!Q || !Q.iv && !Q.paused) return;
  if (!Q.paused){ Q.paused = true; stopTimer(); $("#bPause").textContent = "▶ Tiếp tục"; }
  else { Q.paused = false; $("#bPause").textContent = "⏸ Tạm dừng"; startTimer(); }
}
function onTimeout(){
  SND.timeout();
  if (Q.all){ toast("⏰ HẾT GIỜ!"); reveal(); }
  else if (!Q.judged){ toast("⏰ HẾT GIỜ!"); judge(false); }
}
function showHint(){
  if (Q.hint) return; Q.hint = true; SND.click();
  const h = $("#hintArea"); h.innerHTML = `<div class="hintbox">💡 ${Q.q.hint}${Q.all?"":` <small style="font-family:var(--ui);color:#7e22ce">(điểm còn ×${CONFIG.hintFactor})</small>`}</div>`;
  renderMath(h); $("#bHint").disabled = true;
}
function nextSol(){
  const sol = Q.q.solution; if (Q.solStep >= sol.length) return;
  const a = $("#solArea"); if (!Q.solStep) a.innerHTML = `<div class="sol"><b style="font-family:var(--ui);color:#1d4ed8">📖 Lời giải:</b></div>`;
  const d = document.createElement("div"); d.innerHTML = sol[Q.solStep++]; a.firstChild.appendChild(d); renderMath(d);
  SND.click(); if (Q.solStep >= sol.length) $("#bSol").disabled = true;
}
function answerText(q){
  if (q.type==="mcq") return `<b>${"ABCD"[q.answer]}.</b> ${q.options[q.answer]}`;
  if (q.type==="tf") return q.answer ? "<b>Đúng</b>" : "<b>Sai</b>";
  if (q.type==="num") return Array.isArray(q.answer) ? q.answer.join(" hoặc ") : String(q.answer);
  return q.answer;
}
function markOpts(){
  const q = Q.q, right = q.type==="tf" ? (q.answer?0:1) : q.answer;
  document.querySelectorAll(".opt").forEach(b => { const i=+b.dataset.i; b.classList.add(i===right?"correct":"wrong"); b.disabled = true; });
}
function reveal(){
  if (Q.revealed) return; Q.revealed = true; stopTimer();
  if (Q.q.type==="mcq" || Q.q.type==="tf") markOpts();
  const r = $("#revArea"); r.innerHTML = `<div class="reveal"><b class="lab">✅ Đáp án:</b> ${answerText(Q.q)}</div>`; renderMath(r);
  $("#bReveal").disabled = true;
  if (Q.all) showAllJudge();
  else if (!Q.judged) showTeamJudge(Q.ctx.team, false);
}
/* Một đội trả lời */
function chooseOpt(i){
  if (Q.judged || Q.revealed) { return; }
  SND.click();
  if (Q.all){ document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("chosen", +b.dataset.i===i)); return; }
  const q = Q.q, right = q.type==="tf" ? (q.answer?0:1) : q.answer;
  document.querySelector(`.opt[data-i="${i}"]`).classList.add("chosen");
  judge(i===right);
}
function checkNum(){
  if (Q.judged) return;
  const v = parseNum($("#numIn").value);
  if (isNaN(v)){ $("#numIn").style.borderColor="var(--red)"; return; }
  const ans = Array.isArray(Q.q.answer) ? Q.q.answer : [Q.q.answer], tol = Q.q.tol || 1e-9;
  judge(ans.some(a => Math.abs(Number(a)-v) <= tol));
}
function pointsFor(){ let p = Q.base; if (Q.hint) p = Math.round(p*CONFIG.hintFactor); if (Q.ctx.effect==="star") p *= 2; return p; }
function judge(ok){
  if (Q.judged) return; Q.judged = true; stopTimer();
  $("#judgeArea").innerHTML = "";
  const t = Q.ctx.team, res = $("#resArea");
  if (ok){
    const p = pointsFor(); S.teams[t].score += p; renderScores(t); SND.ok(); confetti(90);
    res.innerHTML = `<div class="result ok">🎉 CHÍNH XÁC! ${S.teams[t].name} +${p} điểm</div>`;
  } else {
    SND.no();
    let msg = `😢 Chưa đúng!`;
    if (Q.ctx.effect==="star"){ const m = Math.min(S.teams[t].score, Q.base); S.teams[t].score -= m; renderScores(t); msg += ` ${S.teams[t].name} bị trừ ${m} điểm (Ngôi sao).`; }
    res.innerHTML = `<div class="result no">${msg}</div>`;
    showSteal();
  }
  if (!Q.revealed) { Q.revealed = true; if (Q.q.type==="mcq"||Q.q.type==="tf") markOpts();
    const r=$("#revArea"); r.innerHTML=`<div class="reveal"><b class="lab">✅ Đáp án:</b> ${answerText(Q.q)}</div>`; renderMath(r); $("#bReveal").disabled=true; }
  if (S.mode==="race") renderBoard();
}
function showTeamJudge(t){
  const j = $("#judgeArea");
  j.innerHTML = `<div class="judge"><span>Chấm ${S.teams[t].name}:</span><button class="btn green" id="jOk">✔ Đúng</button><button class="btn red" id="jNo">✘ Sai</button></div>`;
  $("#jOk").onclick = () => judge(true); $("#jNo").onclick = () => judge(false);
}
function showSteal(){
  const others = S.teams.map((t,i)=>i).filter(i=>i!==Q.ctx.team);
  const p = Math.round(Q.base*CONFIG.stealFactor);
  const j = $("#judgeArea");
  j.innerHTML = `<div class="judge"><span>🙋 Giành quyền (+${p}):</span>${others.map(i=>`<button class="chk" data-i="${i}">${S.teams[i].av} ${S.teams[i].name}</button>`).join("")}</div>`;
  j.querySelectorAll(".chk").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    j.innerHTML = `<div class="judge"><span>${S.teams[i].name} trả lời:</span><button class="btn green" id="sOk">✔ Đúng</button><button class="btn red" id="sNo">✘ Sai</button></div>`;
    $("#sOk").onclick = () => { S.teams[i].score += p; renderScores(i); SND.ok(); confetti(60); j.innerHTML = `<div class="result ok">⚡ ${S.teams[i].name} giành được +${p} điểm!</div>`; if (S.mode==="race") renderBoard(); };
    $("#sNo").onclick = () => { SND.no(); j.innerHTML = `<div class="result no">Chưa đội nào trả lời đúng.</div>`; };
  });
}
/* Cả lớp cùng trả lời */
function showAllJudge(){
  const j = $("#judgeArea");
  j.innerHTML = `<div class="judge"><span>Đội trả lời đúng:</span>${S.teams.map((t,i)=>`<button class="chk" data-i="${i}">${t.av} ${t.name}</button>`).join("")}<button class="btn green" id="bAward">➕ Cộng ${Q.base} điểm</button></div>`;
  j.querySelectorAll(".chk").forEach(b => b.onclick = () => { const i=+b.dataset.i; Q.picks.has(i)?Q.picks.delete(i):Q.picks.add(i); b.classList.toggle("on"); SND.click(); });
  $("#bAward").onclick = () => {
    if (Q.judged) return; Q.judged = true;
    const list = [...Q.picks];
    list.forEach(i => S.teams[i].score += Q.base);
    renderScores(list.length===1?list[0]:-1);
    if (list.length){ SND.ok(); confetti(80); j.innerHTML = `<div class="result ok">🎉 ${list.map(i=>S.teams[i].name).join(", ")} +${Q.base} điểm</div>`; }
    else { SND.no(); j.innerHTML = `<div class="result no">Không có đội nào đúng.</div>`; }
  };
}
function closeQuestion(){
  if (!Q) return; stopTimer();
  // Câu chưa được chấm (thầy đóng sớm) -> vẫn tính là đã dùng
  S.done.add(Q.q.id);
  if (S.mode==="tile" && Q.ctx.tile!==undefined) S.tiles[Q.ctx.tile].open = true;
  if (!Q.all) S.turn = (S.turn + 1) % S.teams.length;
  Q = null; $("#qmodal").classList.add("hidden");
  renderBoard(); renderScores();
  // Kiểm tra kết thúc
  if (S.mode==="tile" && S.tiles.every(t=>t.open)) { S.over = true; toast("🎊 Đã mở hết các ô!",1800); setTimeout(endGame,1800); }
  if (S.mode==="race"){
    const win = S.teams.findIndex(t=>t.score>=S.goal);
    const left = [1,2,3].some(lv=>S.byLv[lv].some(q=>!S.done.has(q.id)));
    if (win>=0){ S.over = true; toast(`🏁 ${S.teams[win].name} VỀ ĐÍCH!`,2000); setTimeout(endGame,2000); }
    else if (!left){ S.over = true; toast("Đã hết câu hỏi!",1600); setTimeout(endGame,1600); }
  }
}

/* ---------- Kết thúc ---------- */
function endGame(){
  if (Q){ stopTimer(); Q=null; $("#qmodal").classList.add("hidden"); }
  const rank = S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top = rank.slice(0,3), order = top.length===3 ? [top[1],top[0],top[2]] : [top[1],top[0]].filter(Boolean);
  const h = {0:260,1:190,2:140}, medal = ["🥇","🥈","🥉"];
  const e = $("#end");
  e.innerHTML = `<div class="logo">🏆 BẢNG VÀNG 🏆</div>
    <div class="podium">${order.map(t=>{const r=top.indexOf(t);return `<div class="pcol"><div class="pav">${medal[r]}${t.av}</div><div class="pnm">${t.name}</div><div class="bar" style="height:${h[r]}px;background:${t.col}">${t.score}</div></div>`}).join("")}</div>
    ${rank.length>3?`<div style="font-size:22px">${rank.slice(3).map((t,k)=>`${k+4}. ${t.name}: ${t.score} điểm`).join(" • ")}</div>`:""}
    <div style="font-size:24px">Chúc mừng <b>${rank[0].name}</b>! Cảm ơn tất cả các đội đã tham gia.</div>
    <div class="ctrl" style="justify-content:center"><button class="btn gold" id="bAgain">↺ Chơi lại</button><button class="btn ghost" id="bMenu">🏠 Chọn trò chơi khác</button></div>`;
  show("end"); SND.up(); confetti(260);
  $("#bAgain").onclick = () => startGame(S.mode);
  $("#bMenu").onclick = initStart;
}

/* ---------- Pháo giấy ---------- */
const fx = $("#fx"), cx = fx.getContext("2d"); let parts = [], raf = null;
function sizeFx(){ fx.width = innerWidth; fx.height = innerHeight; } addEventListener("resize", sizeFx); sizeFx();
function confetti(n){
  const cols = ["#ffc83d","#ff5d8f","#22c55e","#3b82f6","#a855f7","#fff"];
  for (let k=0;k<n;k++) parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.6, y:innerHeight*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, r:Math.random()*8+4, c:cols[k%cols.length], a:Math.random()*6, life:120+Math.random()*60});
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=.2; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
  parts = parts.filter(p=>p.life>0 && p.y<fx.height+20);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,fx.width,fx.height), null);
}

/* ---------- Nút chung & phím tắt ---------- */
$("#bMute").onclick = () => { muted = !muted; $("#bMute").textContent = muted ? "🔇" : "🔊"; };
$("#bFull").onclick = () => { try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} };
$("#bHome").onclick = () => { if (!S || confirm("Về màn hình chính? Ván đang chơi sẽ kết thúc.")){ if (Q){stopTimer();Q=null;$("#qmodal").classList.add("hidden");} initStart(); } };
document.addEventListener("keydown", e => {
  if (e.target.tagName==="INPUT") return;
  const k = e.key.toLowerCase();
  if (k==="f") $("#bFull").click();
  else if (k==="m") $("#bMute").click();
  else if (Q){
    if (k===" "){ e.preventDefault(); Q.revealed ? closeQuestion() : reveal(); }
    else if (k==="escape") closeQuestion();
    else if (k==="p") togglePause();
    else if (/^[1-4]$/.test(k) && document.querySelector(`.opt[data-i="${+k-1}"]`)) chooseOpt(+k-1);
  } else if (k===" " && S && S.mode==="all" && !$("#game").classList.contains("hidden")){ e.preventDefault(); $("#bNextQ") && $("#bNextQ").click(); }
});
window.addEventListener("load", () => { initStart(); });
</script>
</body>
