<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#14161c; --bar:#1f2330; --fg:#f5f5f5; --acc:#ffca28; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Times New Roman", Times, serif; overflow:hidden; }
  #wrap { position:fixed; inset:0 0 64px 0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#fbf8f1; box-shadow:0 10px 40px rgba(0,0,0,.5); max-width:100%; max-height:100%; width:auto; height:100%; object-fit:contain; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:64px; background:var(--bar); display:flex; align-items:center; gap:8px; padding:0 12px; }
  #bar button, #bar select { background:#2c3245; color:var(--fg); border:1px solid #3b4258; border-radius:10px; font:20px "Times New Roman", serif; padding:6px 12px; cursor:pointer; }
  #bar button:hover { background:#3a4260; }
  #seek { flex:1; accent-color:var(--acc); height:24px; }
  #lbl { min-width:190px; text-align:center; font-size:20px; }
  body.rec #bar, body.full #bar { display:none; } body.rec #wrap, body.full #wrap { inset:0; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; background:radial-gradient(circle at 50% 40%, #2b3350, #12141b); z-index:5; text-align:center; padding:16px; }
  #start h1 { font-size:clamp(34px,5vw,72px); margin:0; color:var(--acc); }
  #start p { font-size:clamp(20px,2.4vw,32px); margin:0; opacity:.9; }
  #start button { font:bold clamp(26px,3vw,40px) "Times New Roman", serif; padding:16px 48px; border-radius:60px; border:0; background:var(--acc); color:#222; cursor:pointer; box-shadow:0 8px 30px rgba(255,202,40,.35); }
  #note { font-size:18px; opacity:.75; max-width:900px; }
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333a; padding:8px 16px; border-radius:10px; font-size:20px; display:none; z-index:6; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<div id="bar">
  <button id="bPlay" title="Phát/Dừng (Space)">▶</button>
  <button id="bPrev" title="Cảnh trước (←)">⏮</button>
  <button id="bNext" title="Cảnh sau (→)">⏭</button>
  <button id="bRe" title="Làm lại">↺</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="lbl">Cảnh 1/1</span>
  <select id="sRate" title="Tốc độ đọc"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
  <select id="sVoice" title="Giọng đọc"></select>
  <button id="bSub" title="Phụ đề">CC</button>
  <button id="bMus" title="Nhạc nền">♫</button>
  <button id="bMute" title="Âm thanh">🔊</button>
  <button id="bFull" title="Toàn màn hình (F)">⛶</button>
  <button id="bRec" title="Quay video">⏺</button>
</div>
<div id="start">
  <h1 id="sTitle"></h1>
  <p id="sSub"></p>
  <button id="bStart">▶ Bắt đầu</button>
  <div id="note"></div>
</div>
<div id="toast"></div>
<script>
/*__ENGINE__*/
</script>
<script>
/*__FILM__*/
</script>
<script>
(function () {
  const F = window.FILM, SF = STICKFILM.load(F), cv = document.getElementById("cv"); cv.width = STICKFILM.W; cv.height = STICKFILM.H;
  const $ = (id) => document.getElementById(id);
  document.title = F.title || "Phim người que";
  $("sTitle").textContent = F.title || ""; $("sSub").textContent = F.subtitle || "";
  SF.attach(cv);
  const toast = (m, ms) => { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._h); toast._h = setTimeout(() => (t.style.display = "none"), ms || 3000); };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  let dragging = false;
  SF.onFrame = (t) => {
    if (!dragging) $("seek").value = Math.round((t / SF.duration) * 1000);
    $("lbl").textContent = `Cảnh ${SF.sceneIndex() + 1}/${SF.comp.scenes.length} · ${fmt(t)}/${fmt(SF.duration)}`;
    $("bPlay").textContent = SF.playing ? "⏸" : "▶";
  };
  SF.onEnd = () => { if (document.body.classList.contains("rec")) stopRec(); };
  function fillVoices() {
    const V = STICKFILM.Voice, sel = $("sVoice"); sel.innerHTML = "";
    if (!V.vi.length) { sel.innerHTML = "<option>Không có giọng Việt</option>"; $("note").textContent = "Máy chưa có giọng đọc tiếng Việt — phim vẫn chạy với phụ đề. (Windows: Cài đặt → Thời gian & ngôn ngữ → Giọng nói → thêm Tiếng Việt; hoặc mở bằng Microsoft Edge có sẵn giọng HoaiMy/NamMinh.)"; return; }
    $("note").textContent = "Mẹo: mở bằng Microsoft Edge để có giọng đọc tự nhiên nhất.";
    V.vi.forEach((v, i) => { const o = document.createElement("option"); o.value = i; o.textContent = v.name.replace(/Microsoft |Online \(Natural\) - /g, ""); if (v === V.chosen) o.selected = true; sel.appendChild(o); });
  }
  STICKFILM._onVoices = fillVoices; fillVoices();
  $("sVoice").onchange = (e) => { const v = STICKFILM.Voice.vi[+e.target.value]; if (v) STICKFILM.Voice.chosen = v; };
  $("sRate").onchange = (e) => { STICKFILM.Voice.rate = +e.target.value; SF.speed = +e.target.value; };
  $("bStart").onclick = () => { $("start").style.display = "none"; STICKFILM.Audio.init(); if (F.music) STICKFILM.Audio.music(true); SF.seek(0); SF.play(); };
  $("bPlay").onclick = () => (SF.playing ? SF.pause() : SF.play());
  $("bPrev").onclick = () => SF.goScene(SF.sceneIndex() - (SF.t - SF.comp.scenes[SF.sceneIndex()].start < 1 ? 1 : 0));
  $("bNext").onclick = () => SF.goScene(SF.sceneIndex() + 1);
  $("bRe").onclick = () => { SF.seek(0); SF.play(); };
  $("bSub").onclick = () => { STICKFILM.ui.subs = !STICKFILM.ui.subs; toast(STICKFILM.ui.subs ? "Bật phụ đề" : "Tắt phụ đề", 1200); };
  $("bMus").onclick = () => { const on = !STICKFILM.Audio.musicNode; STICKFILM.Audio.init(); STICKFILM.Audio.music(on); toast(on ? "Bật nhạc nền" : "Tắt nhạc nền", 1200); };
  $("bMute").onclick = () => { const A = STICKFILM.Audio; A.muted = !A.muted; SF.useVoice = !A.muted; if (A.muted) STICKFILM.Voice.stop(); $("bMute").textContent = A.muted ? "🔇" : "🔊"; };
  $("bFull").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  document.addEventListener("fullscreenchange", () => document.body.classList.toggle("full", !!document.fullscreenElement));
  const seek = $("seek");
  seek.oninput = () => { dragging = true; SF.seek((seek.value / 1000) * SF.duration); };
  seek.onchange = () => { dragging = false; };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); SF.playing ? SF.pause() : SF.play(); }
    if (e.code === "ArrowRight") $("bNext").click();
    if (e.code === "ArrowLeft") $("bPrev").click();
    if (e.code === "KeyF") $("bFull").click();
  });
  // ---- quay video ngay trong trình duyệt (ghi cả giọng đọc nhờ chia sẻ âm thanh tab) ----
  let rec = null, chunks = [], stream = null;
  async function startRec() {
    try {
      toast("Chọn \"Tab này\" và tích \"Chia sẻ âm thanh của tab\"", 5000);
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true, preferCurrentTab: true, selfBrowserSurface: "include" });
    } catch (e) { toast("Đã hủy quay video"); return; }
    chunks = []; const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus") ? "video/webm;codecs=vp9,opus" : "video/webm";
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 });
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const blob = new Blob(chunks, { type: "video/webm" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (F.file || "phim-nguoi-que") + ".webm"; a.click(); stream.getTracks().forEach((t) => t.stop()); document.body.classList.remove("rec"); };
    stream.getVideoTracks()[0].onended = () => stopRec();
    document.body.classList.add("rec"); $("start").style.display = "none";
    await new Promise((r) => setTimeout(r, 800)); rec.start(); SF.seek(0); SF.play();
  }
  function stopRec() { if (rec && rec.state !== "inactive") rec.stop(); }
  $("bRec").onclick = () => (rec && rec.state === "recording" ? stopRec() : startRec());
  window.__READY__ = true;
})();
</script>
</body>
</html>
